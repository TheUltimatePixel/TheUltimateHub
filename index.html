<!DOCTYPE html>
<html>
<head>
  <title>The Ultimate Game</title>
</head>
<body>

  <h1>The_Ultimate_Game</h1>
  <h2>This is hand made so please play it</h2>

  <!-- 1. Display element with an id -->
  <h3 id="scoreText">0 clicks</h3>

  <!-- 2. Button runs function -->
  <button onclick="handleClick()">click</button>

  <script>
    let clicks = 0;

    function handleClick() {
      clicks = clicks + 1;
      
      // 3. Update the text directly on the page
      document.getElementById("scoreText").innerText = `${clicks} clicks`;
    }
  </script>

</body>
</html>
